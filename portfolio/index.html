<!doctype html>
<html lang="es" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Carlos Sequeiros — Backend Engineer & Software Architect. Rust, Clean Architecture, AWS, CI/CD e IA/Agentes." />
    <meta name="theme-color" content="#f5f5f7" />
    <meta property="og:title" content="Carlos Sequeiros | Backend Engineer & Software Architect" />
    <meta property="og:description" content="Diseño y construyo backends con Rust, Clean Architecture y AWS." />
    <meta property="og:type" content="website" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23007aff'/%3E%3Ctext x='16' y='22' font-size='14' font-family='Arial' font-weight='700' text-anchor='middle' fill='white'%3ECS%3C/text%3E%3C/svg%3E" />
    <title>Carlos Sequeiros | Backend Engineer & Software Architect</title>
    <script>
      // Aplica el tema antes del primer render para evitar parpadeos
      (function () {
        try {
          var saved = localStorage.getItem("theme");
          var theme = saved === "light" || saved === "dark"
            ? saved
            : (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
          document.documentElement.dataset.theme = theme;
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
